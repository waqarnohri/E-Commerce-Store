<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - E-Commerce Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0056b3;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>Login</h1>

    <p class="subtitle">
        Welcome back to E-Commerce Store
    </p>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div
        id="message"
        class="message">
    </div>

    <div class="register-link">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        message.style.color = "#333";

        message.textContent =
            "Logging in...";


        try {

            const response =
                await fetch("/api/auth/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


            const data =
                await response.json();


            console.log("LOGIN RESPONSE:", data);


            if (!response.ok) {

                message.style.color = "red";

                message.textContent =
                    data.message ||
                    "Login failed";

                return;
            }


            /*
             * IMPORTANT
             * Save token in localStorage
             */

            localStorage.setItem(
                "token",
                data.token
            );


            /*
             * Save user information
             */

            if (data.user) {

                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

            }


            message.style.color = "green";

            message.textContent =
                "Login successful! Redirecting...";


            /*
             * Check admin role
             */

            if (
                data.user &&
                data.user.role === "admin"
            ) {

                setTimeout(() => {

                    window.location.href =
                        "/admin";

                }, 500);

            } else {

                setTimeout(() => {

                    window.location.href =
                        "/products";

                }, 500);

            }

        } catch (error) {

            console.error(error);

            message.style.color = "red";

            message.textContent =
                "Server connection failed";

        }

    }

);

</script>

</body>
</html>
