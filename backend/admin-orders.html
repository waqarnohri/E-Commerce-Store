<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Orders - ShopHub</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;

            left: 0;
            top: 0;

            width: 240px;
            height: 100vh;

            background: #111827;

            color: white;

            padding: 25px 15px;

            z-index: 100;
        }


        .brand {
            font-size: 23px;

            font-weight: bold;

            text-align: center;

            padding-bottom: 25px;

            border-bottom:
                1px solid #374151;

            margin-bottom: 25px;
        }


        .admin-label {
            text-align: center;

            color: #9ca3af;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 20px;
        }


        .nav-link {
            display: block;

            color: #d1d5db;

            text-decoration: none;

            padding: 13px 15px;

            border-radius: 8px;

            margin-bottom: 7px;

            font-size: 14px;
        }


        .nav-link:hover,
        .nav-link.active {
            background: #2563eb;

            color: white;
        }


        .logout-sidebar {
            position: absolute;

            bottom: 25px;

            left: 15px;
            right: 15px;

            width: calc(100% - 30px);

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #dc2626;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .logout-sidebar:hover {
            background: #b91c1c;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            margin-left: 240px;

            min-height: 100vh;

            padding: 30px;
        }


        /* =========================
           HEADER
        ========================= */

        .topbar {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }


        .topbar h1 {
            font-size: 30px;
        }


        .topbar p {
            color: #6b7280;

            margin-top: 6px;

            font-size: 14px;
        }


        .dashboard-btn {
            display: inline-block;

            background: white;

            color: #2563eb;

            border: 1px solid #2563eb;

            padding: 11px 17px;

            border-radius: 8px;

            text-decoration: none;

            font-weight: bold;

            font-size: 14px;
        }


        .dashboard-btn:hover {
            background: #2563eb;

            color: white;
        }


        /* =========================
           FILTER BAR
        ========================= */

        .filter-section {
            background: white;

            padding: 20px;

            border-radius: 13px;

            border: 1px solid #e5e7eb;

            margin-bottom: 25px;

            box-shadow:
                0 3px 12px
                rgba(0, 0, 0, 0.04);
        }


        .filter-row {
            display: flex;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .filter-label {
            font-weight: bold;

            font-size: 14px;
        }


        #statusFilter {
            padding: 11px 15px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            outline: none;

            min-width: 190px;

            font-size: 14px;

            background: white;
        }


        #statusFilter:focus {
            border-color: #2563eb;
        }


        .refresh-btn {
            padding: 11px 17px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .refresh-btn:hover {
            background: #374151;
        }


        /* =========================
           ORDER COUNT
        ========================= */

        .order-count {
            color: #6b7280;

            font-size: 14px;

            margin-bottom: 15px;
        }


        /* =========================
           ORDERS
        ========================= */

        #ordersContainer {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .order-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.05);
        }


        /* =========================
           ORDER TOP
        ========================= */

        .order-top {
            background: #f9fafb;

            padding: 18px 20px;

            border-bottom:
                1px solid #e5e7eb;

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;
        }


        .order-id {
            font-size: 15px;

            font-weight: bold;
        }


        .order-date {
            color: #6b7280;

            font-size: 12px;

            margin-top: 5px;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 7px 12px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: bold;

            white-space: nowrap;
        }


        .status-pending {
            background: #fef3c7;

            color: #92400e;
        }


        .status-confirmed {
            background: #dbeafe;

            color: #1e40af;
        }


        .status-shipped {
            background: #e0e7ff;

            color: #3730a3;
        }


        .status-delivered {
            background: #dcfce7;

            color: #166534;
        }


        .status-cancelled {
            background: #fee2e2;

            color: #991b1b;
        }


        /* =========================
           ORDER BODY
        ========================= */

        .order-body {
            padding: 20px;
        }


        .customer-box {
            background: #f9fafb;

            border: 1px solid #e5e7eb;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 18px;
        }


        .customer-title {
            font-size: 12px;

            text-transform: uppercase;

            color: #6b7280;

            font-weight: bold;

            margin-bottom: 8px;
        }


        .customer-name {
            font-size: 15px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .customer-email {
            color: #6b7280;

            font-size: 13px;

            word-break: break-word;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .items-title {
            font-size: 15px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .item {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding: 10px 0;

            border-bottom:
                1px solid #f0f0f0;
        }


        .item-name {
            font-size: 13px;

            font-weight: bold;
        }


        .item-details {
            color: #6b7280;

            font-size: 12px;

            margin-top: 4px;
        }


        .item-total {
            font-weight: bold;

            font-size: 13px;

            white-space: nowrap;
        }


        /* =========================
           INFO
        ========================= */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;

            margin-top: 18px;
        }


        .info-box {
            background: #f9fafb;

            border: 1px solid #e5e7eb;

            border-radius: 9px;

            padding: 13px;
        }


        .info-label {
            color: #6b7280;

            font-size: 10px;

            font-weight: bold;

            text-transform: uppercase;

            margin-bottom: 6px;
        }


        .info-value {
            font-size: 12px;

            font-weight: bold;

            word-break: break-word;
        }


        /* =========================
           TOTAL
        ========================= */

        .total-row {
            border-top:
                1px solid #e5e7eb;

            margin-top: 18px;

            padding-top: 17px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .total-label {
            font-size: 16px;

            font-weight: bold;
        }


        .total-value {
            font-size: 21px;

            font-weight: bold;

            color: #2563eb;
        }


        /* =========================
           STATUS UPDATE
        ========================= */

        .update-section {
            margin-top: 18px;

            padding-top: 18px;

            border-top:
                1px solid #e5e7eb;
        }


        .update-label {
            font-size: 12px;

            font-weight: bold;

            margin-bottom: 8px;

            color: #374151;
        }


        .update-row {
            display: flex;

            gap: 8px;
        }


        .update-row select {
            flex: 1;

            padding: 10px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            outline: none;

            background: white;
        }


        .update-btn {
            padding: 10px 15px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .update-btn:hover {
            background: #1d4ed8;
        }


        .update-btn:disabled {
            background: #9ca3af;

            cursor: not-allowed;
        }


        /* =========================
           LOADING
        ========================= */

        .loading {
            background: white;

            padding: 60px;

            border-radius: 15px;

            text-align: center;

            color: #6b7280;

            font-size: 18px;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty {
            grid-column: 1 / -1;

            background: white;

            padding: 60px 20px;

            border-radius: 15px;

            text-align: center;

            color: #6b7280;

            border: 1px solid #e5e7eb;
        }


        .empty-icon {
            font-size: 55px;

            margin-bottom: 12px;
        }


        .empty h2 {
            color: #111827;

            margin-bottom: 8px;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            position: fixed;

            top: 25px;

            right: 25px;

            color: white;

            padding: 14px 20px;

            border-radius: 8px;

            display: none;

            z-index: 9999;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.2);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 1000px) {

            #ordersContainer {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 800px) {

            .sidebar {
                position: static;

                width: 100%;

                height: auto;
            }


            .logout-sidebar {
                position: static;

                width: 100%;

                margin-top: 15px;
            }


            .main {
                margin-left: 0;

                padding: 20px;
            }


            .topbar {
                flex-direction: column;

                align-items: flex-start;
            }

        }


        @media (max-width: 550px) {

            .main {
                padding: 15px;
            }


            .info-grid {
                grid-template-columns: 1fr;
            }


            .update-row {
                flex-direction: column;
            }


            .update-btn {
                width: 100%;
            }


            .order-top {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">
            🛍️ ShopHub
        </div>


        <div class="admin-label">
            Admin Panel
        </div>


        <a
            href="/admin"
            class="nav-link"
        >
            📊 Dashboard
        </a>


        <a
            href="/admin/orders"
            class="nav-link active"
        >
            📦 Manage Orders
        </a>


        <a
            href="/products"
            class="nav-link"
        >
            🛍️ Store
        </a>


        <a
            href="/profile"
            class="nav-link"
        >
            👤 My Profile
        </a>


        <button
            class="logout-sidebar"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </aside>



    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">


        <!-- HEADER -->

        <div class="topbar">

            <div>

                <h1>
                    📦 Manage Orders
                </h1>

                <p>
                    View and update customer orders.
                </p>

            </div>


            <a
                href="/admin"
                class="dashboard-btn"
            >
                ← Dashboard
            </a>

        </div>



        <!-- =========================
             FILTER
        ========================= -->

        <div class="filter-section">

            <div class="filter-row">

                <span class="filter-label">
                    Filter by Status:
                </span>


                <select
                    id="statusFilter"
                    onchange="filterOrders()"
                >

                    <option value="All">
                        All Orders
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Confirmed">
                        Confirmed
                    </option>

                    <option value="Shipped">
                        Shipped
                    </option>

                    <option value="Delivered">
                        Delivered
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>


                <button
                    class="refresh-btn"
                    onclick="loadOrders()"
                >
                    🔄 Refresh
                </button>

            </div>

        </div>



        <!-- COUNT -->

        <div
            id="orderCount"
            class="order-count"
        >
            Loading orders...
        </div>



        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >
            Loading orders...
        </div>



        <!-- ORDERS -->

        <div
            id="ordersContainer"
        >
        </div>


    </main>



    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
    >
    </div>



    <script>


        // =========================
        // GLOBAL
        // =========================

        const token =
            localStorage.getItem(
                "token"
            );


        let allOrders =
            [];


        // =========================
        // CHECK AUTH
        // =========================

        function checkAuth() {

            if (!token) {

                window.location.href =
                    "/login";

                return false;

            }


            return true;

        }


        if (!checkAuth()) {

            throw new Error(
                "Authentication required"
            );

        }



        // =========================
        // AUTH HEADERS
        // =========================

        function authHeaders() {

            return {

                "Authorization":
                    `Bearer ${token}`,

                "Content-Type":
                    "application/json"

            };

        }



        // =========================
        // LOAD ORDERS
        // =========================

        async function loadOrders() {

            const loading =
                document.getElementById(
                    "loading"
                );


            loading.style.display =
                "block";


            try {

                const response =
                    await fetch(
                        "/api/orders/admin/all",
                        {

                            method: "GET",

                            headers:
                                authHeaders()

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.status === 401
                ) {

                    logout();

                    return;

                }


                if (
                    response.status === 403
                ) {

                    alert(
                        "Access denied. Admin only."
                    );


                    window.location.href =
                        "/";

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load orders"
                    );

                }


                allOrders =
                    data.orders || [];


                loading.style.display =
                    "none";


                filterOrders();


            } catch (error) {

                console.error(
                    error
                );


                loading.textContent =
                    "❌ Failed to load orders. Please try again.";

                document.getElementById(
                    "orderCount"
                ).textContent =
                    "Unable to load orders.";

            }

        }



        // =========================
        // FILTER ORDERS
        // =========================

        function filterOrders() {

            const selectedStatus =
                document.getElementById(
                    "statusFilter"
                ).value;


            let filteredOrders =
                allOrders;


            if (
                selectedStatus !== "All"
            ) {

                filteredOrders =
                    allOrders.filter(
                        order =>
                            order.orderStatus ===
                            selectedStatus
                    );

            }


            document.getElementById(
                "orderCount"
            ).textContent =
                `${filteredOrders.length} order${
                    filteredOrders.length === 1
                        ? ""
                        : "s"
                } found`;


            displayOrders(
                filteredOrders
            );

        }



        // =========================
        // DISPLAY ORDERS
        // =========================

        function displayOrders(
            orders
        ) {

            const container =
                document.getElementById(
                    "ordersContainer"
                );


            container.innerHTML =
                "";


            if (
                !orders ||
                orders.length === 0
            ) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📦
                        </div>


                        <h2>
                            No Orders Found
                        </h2>


                        <p>
                            There are no orders matching this filter.
                        </p>

                    </div>

                `;


                return;

            }


            orders.forEach(
                order => {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "order-card";


                    const status =
                        order.orderStatus ||
                        "Pending";


                    card.innerHTML = `

                        <!-- ORDER TOP -->

                        <div class="order-top">

                            <div>

                                <div class="order-id">

                                    Order #
                                    ${String(
                                        order._id
                                    ).slice(-8).toUpperCase()}

                                </div>


                                <div class="order-date">

                                    ${formatDate(
                                        order.createdAt
                                    )}

                                </div>

                            </div>


                            <span
                                class="status ${getStatusClass(
                                    status
                                )}"
                            >

                                ${escapeHTML(
                                    status
                                )}

                            </span>

                        </div>



                        <!-- ORDER BODY -->

                        <div class="order-body">


                            <!-- CUSTOMER -->

                            <div class="customer-box">

                                <div class="customer-title">
                                    Customer
                                </div>


                                <div class="customer-name">

                                    👤
                                    ${escapeHTML(
                                        order.user?.name ||
                                        "Unknown Customer"
                                    )}

                                </div>


                                <div class="customer-email">

                                    📧
                                    ${escapeHTML(
                                        order.user?.email ||
                                        "No email available"
                                    )}

                                </div>

                            </div>



                            <!-- PRODUCTS -->

                            <div class="items-title">
                                🛍️ Ordered Products
                            </div>


                            ${
                                createItemsHTML(
                                    order.items
                                )
                            }



                            <!-- INFORMATION -->

                            <div class="info-grid">


                                <div class="info-box">

                                    <div class="info-label">
                                        Payment
                                    </div>


                                    <div class="info-value">

                                        💵
                                        ${escapeHTML(
                                            order.paymentMethod ||
                                            "Cash on Delivery"
                                        )}

                                    </div>

                                </div>



                                <div class="info-box">

                                    <div class="info-label">
                                        Shipping Address
                                    </div>


                                    <div class="info-value">

                                        📍
                                        ${escapeHTML(
                                            order.shippingAddress ||
                                            "Not available"
                                        )}

                                    </div>

                                </div>


                            </div>



                            <!-- TOTAL -->

                            <div class="total-row">

                                <span class="total-label">
                                    Order Total
                                </span>


                                <span class="total-value">

                                    Rs.
                                    ${Number(
                                        order.totalAmount ||
                                        0
                                    ).toLocaleString()}

                                </span>

                            </div>



                            <!-- UPDATE -->

                            <div class="update-section">

                                <div class="update-label">
                                    Update Order Status
                                </div>


                                <div class="update-row">


                                    <select
                                        id="status-${order._id}"
                                    >

                                        <option
                                            value="Pending"
                                            ${
                                                status ===
                                                "Pending"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Pending
                                        </option>


                                        <option
                                            value="Confirmed"
                                            ${
                                                status ===
                                                "Confirmed"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Confirmed
                                        </option>


                                        <option
                                            value="Shipped"
                                            ${
                                                status ===
                                                "Shipped"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Shipped
                                        </option>


                                        <option
                                            value="Delivered"
                                            ${
                                                status ===
                                                "Delivered"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Delivered
                                        </option>


                                        <option
                                            value="Cancelled"
                                            ${
                                                status ===
                                                "Cancelled"
                                                    ? "selected"
                                                    : ""
                                            }
                                        >
                                            Cancelled
                                        </option>

                                    </select>


                                    <button
                                        class="update-btn"
                                        onclick="updateStatus('${order._id}')"
                                    >
                                        Update
                                    </button>


                                </div>

                            </div>


                        </div>

                    `;


                    container.appendChild(
                        card
                    );

                }
            );

        }



        // =========================
        // CREATE ITEMS
        // =========================

        function createItemsHTML(
            items
        ) {

            if (
                !items ||
                items.length === 0
            ) {

                return `

                    <p
                        style="
                            color:#6b7280;
                            font-size:13px;
                            margin-bottom:15px;
                        "
                    >
                        No products found.
                    </p>

                `;

            }


            return items.map(
                item => {

                    const price =
                        Number(
                            item.price || 0
                        );


                    const quantity =
                        Number(
                            item.quantity || 0
                        );


                    const total =
                        price *
                        quantity;


                    return `

                        <div class="item">

                            <div>

                                <div class="item-name">

                                    ${escapeHTML(
                                        item.name ||
                                        "Product"
                                    )}

                                </div>


                                <div class="item-details">

                                    Rs.
                                    ${price.toLocaleString()}

                                    ×

                                    ${quantity}

                                </div>

                            </div>


                            <div class="item-total">

                                Rs.
                                ${total.toLocaleString()}

                            </div>

                        </div>

                    `;

                }
            ).join("");

        }



        // =========================
        // UPDATE STATUS
        // =========================

        async function updateStatus(
            orderId
        ) {

            const select =
                document.getElementById(
                    `status-${orderId}`
                );


            const newStatus =
                select.value;


            const buttons =
                document.querySelectorAll(
                    ".update-btn"
                );


            try {

                const response =
                    await fetch(
                        `/api/orders/admin/${orderId}/status`,
                        {

                            method: "PUT",

                            headers:
                                authHeaders(),

                            body:
                                JSON.stringify({

                                    orderStatus:
                                        newStatus

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.status === 401
                ) {

                    logout();

                    return;

                }


                if (
                    response.status === 403
                ) {

                    showMessage(
                        "Admin access required.",
                        true
                    );

                    return;

                }


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to update status"
                    );

                }


                showMessage(
                    "Order status updated successfully. ✅",
                    false
                );


                await loadOrders();


            } catch (error) {

                console.error(
                    error
                );


                showMessage(
                    error.message ||
                    "Failed to update order status.",
                    true
                );

            }

        }



        // =========================
        // STATUS CLASS
        // =========================

        function getStatusClass(
            status
        ) {

            switch (status) {

                case "Confirmed":

                    return "status-confirmed";


                case "Shipped":

                    return "status-shipped";


                case "Delivered":

                    return "status-delivered";


                case "Cancelled":

                    return "status-cancelled";


                default:

                    return "status-pending";

            }

        }



        // =========================
        // FORMAT DATE
        // =========================

        function formatDate(
            dateString
        ) {

            if (!dateString) {

                return "N/A";

            }


            return new Date(
                dateString
            ).toLocaleDateString(
                "en-PK",
                {

                    day: "2-digit",

                    month: "short",

                    year: "numeric",

                    hour: "2-digit",

                    minute: "2-digit"

                }
            );

        }



        // =========================
        // ESCAPE HTML
        // =========================

        function escapeHTML(
            value
        ) {

            const div =
                document.createElement(
                    "div"
                );


            div.textContent =
                value || "";


            return div.innerHTML;

        }



        // =========================
        // MESSAGE
        // =========================

        function showMessage(
            message,
            isError
        ) {

            const box =
                document.getElementById(
                    "message"
                );


            box.textContent =
                message;


            box.style.background =
                isError
                    ? "#dc2626"
                    : "#16a34a";


            box.style.display =
                "block";


            setTimeout(
                () => {

                    box.style.display =
                        "none";

                },
                3000
            );

        }



        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "token"
            );


            localStorage.removeItem(
                "user"
            );


            window.location.href =
                "/login";

        }



        // =========================
        // START
        // =========================

        loadOrders();

    </script>


</body>

</html>
