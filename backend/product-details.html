<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - ShopHub</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */

        nav {
            background: #111827;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        /* PRODUCT */

        .product-box {
            background: white;
            border-radius: 16px;
            padding: 35px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;
            height: 430px;
            object-fit: contain;
            background: #f3f4f6;
            border-radius: 14px;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            display: inline-block;
            color: #2563eb;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 18px;
            color: #111827;
        }

        .description {
            color: #6b7280;
            line-height: 1.7;
            font-size: 16px;
            margin-bottom: 22px;
        }

        .price {
            font-size: 32px;
            font-weight: bold;
            color: #16a34a;
            margin-bottom: 15px;
        }

        .stock {
            margin-bottom: 25px;
            font-weight: bold;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .quantity-box label {
            font-weight: bold;
        }

        .quantity-box input {
            width: 80px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }

        .add-cart {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .add-cart:hover {
            background: #1d4ed8;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 80px;
        }

        .error {
            text-align: center;
            color: #dc2626;
            font-size: 18px;
            padding: 80px;
        }

        /* FOOTER */

        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 60px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            nav {
                flex-direction: column;
            }

            nav a {
                margin: 0 8px;
            }

            .product-box {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .product-image {
                height: 300px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            🛍️ ShopHub
        </div>

        <div>

            <a href="/">Home</a>

            <a href="/products">
                Products
            </a>

            <a href="/cart">
                Cart 🛒
            </a>

            <a href="/orders">
                Orders
            </a>

        </div>

    </nav>


    <!-- MAIN -->

    <div class="container">

        <div id="loading" class="loading">
            Loading product...
        </div>

        <div id="error" class="error"
             style="display:none;">
        </div>


        <div
            id="productContainer"
            class="product-box"
            style="display:none;"
        >

            <!-- IMAGE -->

            <div>

                <img
                    id="productImage"
                    class="product-image"
                    src=""
                    alt="Product"
                >

            </div>


            <!-- INFORMATION -->

            <div class="product-info">

                <span
                    id="productCategory"
                    class="category"
                >
                </span>


                <h1 id="productName">
                </h1>


                <p
                    id="productDescription"
                    class="description"
                >
                </p>


                <div
                    id="productPrice"
                    class="price"
                >
                </div>


                <div
                    id="productStock"
                    class="stock"
                >
                </div>


                <div class="quantity-box">

                    <label for="quantity">
                        Quantity:
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                    >

                </div>


                <button
                    class="add-cart"
                    onclick="addToCart()"
                >
                    🛒 Add to Cart
                </button>


                <div
                    id="message"
                    class="message"
                >
                </div>


                <a
                    href="/products"
                    class="back-btn"
                >
                    ← Back to Products
                </a>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 ShopHub. All Rights Reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script>

        let currentProduct = null;


        // ===============================
        // GET PRODUCT ID
        // ===============================

        const params =
            new URLSearchParams(
                window.location.search
            );

        const productId =
            params.get("id");


        // ===============================
        // LOAD PRODUCT
        // ===============================

        async function loadProduct() {

            if (!productId) {

                showError(
                    "Product ID is missing."
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/products/${productId}`
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    showError(
                        data.message ||
                        "Product not found."
                    );

                    return;
                }


                currentProduct =
                    data.product;


                displayProduct(
                    currentProduct
                );


            } catch (error) {

                console.error(error);

                showError(
                    "Unable to load product."
                );

            }

        }


        // ===============================
        // DISPLAY PRODUCT
        // ===============================

        function displayProduct(product) {

            document.getElementById(
                "loading"
            ).style.display = "none";


            document.getElementById(
                "productContainer"
            ).style.display = "grid";


            document.getElementById(
                "productName"
            ).textContent =
                product.name;


            document.getElementById(
                "productDescription"
            ).textContent =
                product.description;


            document.getElementById(
                "productCategory"
            ).textContent =
                product.category;


            document.getElementById(
                "productPrice"
            ).textContent =
                "Rs. " +
                Number(product.price)
                    .toLocaleString();


            document.getElementById(
                "productStock"
            ).textContent =
                product.stock > 0
                    ? `In Stock: ${product.stock}`
                    : "Out of Stock";


            const image =
                document.getElementById(
                    "productImage"
                );


            image.src =
                product.image ||
                "https://via.placeholder.com/500x500?text=No+Image";


            image.onerror = function() {

                this.src =
                    "https://via.placeholder.com/500x500?text=No+Image";

            };


            const quantity =
                document.getElementById(
                    "quantity"
                );


            quantity.max =
                product.stock;


            if (product.stock <= 0) {

                document.querySelector(
                    ".add-cart"
                ).disabled = true;

                document.querySelector(
                    ".add-cart"
                ).style.background =
                    "#9ca3af";

                document.querySelector(
                    ".add-cart"
                ).textContent =
                    "Out of Stock";

            }

        }


        // ===============================
        // ADD TO CART
        // ===============================

        async function addToCart() {

            if (!currentProduct) {
                return;
            }


            const token =
                localStorage.getItem("token");


            if (!token) {

                alert(
                    "Please login first."
                );

                window.location.href =
                    "/login";

                return;
            }


            const quantity =
                Number(
                    document.getElementById(
                        "quantity"
                    ).value
                );


            if (
                !quantity ||
                quantity < 1
            ) {

                showMessage(
                    "Please enter a valid quantity.",
                    true
                );

                return;
            }


            if (
                quantity >
                currentProduct.stock
            ) {

                showMessage(
                    "Not enough stock available.",
                    true
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        "/api/cart/add",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`

                            },

                            body:
                                JSON.stringify({

                                    productId:
                                        currentProduct._id,

                                    quantity:
                                        quantity

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    response.status === 401
                ) {

                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );

                    alert(
                        "Session expired. Please login again."
                    );

                    window.location.href =
                        "/login";

                    return;
                }


                if (!response.ok) {

                    showMessage(
                        data.message ||
                        "Failed to add product to cart.",
                        true
                    );

                    return;
                }


                showMessage(
                    "Product added to cart successfully! 🛒",
                    false
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    "Something went wrong.",
                    true
                );

            }

        }


        // ===============================
        // MESSAGE
        // ===============================

        function showMessage(
            message,
            isError
        ) {

            const box =
                document.getElementById(
                    "message"
                );


            box.textContent =
                message;


            box.style.display =
                "block";


            if (isError) {

                box.style.background =
                    "#fee2e2";

                box.style.color =
                    "#b91c1c";

            } else {

                box.style.background =
                    "#dcfce7";

                box.style.color =
                    "#166534";

            }

        }


        // ===============================
        // ERROR
        // ===============================

        function showError(message) {

            document.getElementById(
                "loading"
            ).style.display = "none";


            const errorBox =
                document.getElementById(
                    "error"
                );


            errorBox.textContent =
                message;


            errorBox.style.display =
                "block";

        }


        // ===============================
        // START
        // ===============================

        loadProduct();

    </script>


</body>

</html>
