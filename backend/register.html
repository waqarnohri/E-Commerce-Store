<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register - E-Commerce Store</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Create Account</h1>

    <form id="registerForm">

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        minlength="6"
        required
      >

      <button type="submit">
        Register
      </button>

    </form>

    <div id="message"></div>

    <div class="login-link">
      Already have an account?
      <a href="/login">Login</a>
    </div>

  </div>


  <script>

    document
      .getElementById("registerForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
          document.getElementById("name").value;

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;


        const message =
          document.getElementById("message");


        try {

          const response =
            await fetch("/api/auth/register", {

              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({

                name: name,
                email: email,
                password: password

              })

            });


          const data =
            await response.json();


          if (data.success) {

            message.innerText =
              "Registration successful ✅";

            message.style.color =
              "green";

            document
              .getElementById("registerForm")
              .reset();

          } else {

            message.innerText =
              data.message;

            message.style.color =
              "red";

          }


        } catch (error) {

          message.innerText =
            "Something went wrong ❌";

          message.style.color =
            "red";

          console.error(error);

        }

      });

  </script>

</body>
</html>
